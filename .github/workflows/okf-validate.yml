name: okf-validate

# Enforce OKF v0.1 frontmatter conformance on this repo's docs (handbook ADR-0023).
# Pure stdlib Python, no deps. bin/okf-validate.py + bin/okf_ignore.py are VENDORED
# verbatim from the handbook (VAULTS/handbook/bin) — resync if the handbook rules move.
# No tag-allowlist here (no bin/okf-tags.yaml) → tag check auto-skips; we enforce
# frontmatter + type + reserved-index/log only. Handbook-specific driftcheck omitted.

on:
  push:
    paths:
      - "**/*.md"
      - "bin/okf-*.py"
      - "bin/okf_ignore.py"
      - ".github/workflows/okf-validate.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "bin/okf-*.py"
      - "bin/okf_ignore.py"

# Opt into Node 24 now (Node 20 deprecated on runners 2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  okf-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OKF frontmatter
        run: python bin/okf-validate.py
